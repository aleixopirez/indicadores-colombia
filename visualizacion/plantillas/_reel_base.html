<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>{% block titulo_pagina %}Reel{% endblock %} · Indicadores Colombia</title>
{% include "_estilos.html" %}
<style>
  /* Lienzo vertical 1080×1920. Zona segura (no la tapan los botones de
     TikTok/Instagram/Facebook): x 60–940, y 160–1480. */
  html, body { width: {{ reel.ancho }}px; height: {{ reel.alto }}px; overflow: hidden; }
  .lienzo {
    position: relative; width: {{ reel.ancho }}px; height: {{ reel.alto }}px;
    background:
      radial-gradient(900px 700px at 85% 8%, rgba(245,183,0,0.10), transparent 60%),
      radial-gradient(800px 800px at 0% 100%, rgba(56,189,248,0.07), transparent 60%),
      var(--fondo);
  }
  .zona { position: absolute; left: {{ reel.seguro.izq }}px; width: {{ reel.seguro.der - reel.seguro.izq }}px; }
  .encabezado { top: 170px; }
  .encabezado .ceja { font-size: 26px; }
  .encabezado h1 { font-size: 68px; line-height: 1.05; font-weight: 800; margin-top: 18px; letter-spacing: -0.02em; }
  .encabezado p { font-size: 30px; line-height: 1.3; margin-top: 18px; }
  .contenido { top: 500px; height: 800px; }
  .pie { top: 1320px; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
  .pie .fuente { font-size: 22px; }
  .pie .nota { font-size: 20px; line-height: 1.35; }
  .pie .marca { font-size: 20px; display: flex; justify-content: space-between; }
  .grafica { width: 100%; height: 100%; }

  /* Entrada animada (el video dura {{ duracion_ms // 1000 }} s) */
  .entra { opacity: 0; transform: translateY(24px); animation: entrar .7s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes entrar { to { opacity: 1; transform: none; } }
  .d0 { animation-delay: .05s } .d1 { animation-delay: .25s } .d2 { animation-delay: .45s }
  .d3 { animation-delay: .9s }  .d4 { animation-delay: 1.3s } .d5 { animation-delay: 1.7s }
  .dpie { animation-delay: 3.0s }
  {% block estilos %}{% endblock %}
</style>
</head>
<body>
<div class="lienzo">
  <header class="zona encabezado">
    <div class="ceja entra d0">{% block ceja %}{% endblock %}</div>
    <h1 class="entra d1">{% block titulo %}{% endblock %}</h1>
    <p class="secundario entra d2">{% block subtitulo %}{% endblock %}</p>
  </header>

  <main class="zona contenido">{% block contenido %}{% endblock %}</main>

  <footer class="zona pie entra dpie">
    {% block nota %}{% endblock %}
    <div class="fuente secundario">Fuente: {% block fuente %}{% endblock %}</div>
    <div class="marca tenue"><span>Datos al <span id="fecha-corte"></span></span><span>Pipeline de datos abiertos</span></div>
  </footer>
</div>

<script>{{ libreria }}</script>
<script>const D = {{ datos }};</script>
<script>{{ formato }}</script>
<script>{{ comun }}</script>
<script>
  document.getElementById("fecha-corte").textContent = fmt.fecha(D.fecha_corte);
  {% block script %}{% endblock %}
  // Señal para la captura: todo quedó quieto
  setTimeout(() => { window.__listo = true; }, 4300);
</script>
</body>
</html>
